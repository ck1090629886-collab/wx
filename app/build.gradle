plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.beautifulwechat'
    compileSdk 34

    defaultConfig {
        applicationId "com.beautifulwechat"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            merges += "META-INF/xposed/*"
        }
    }
}

dependencies {
    // LSPosed Modern API
    compileOnly 'io.github.libxposed:api:102.0.0'
    
    // Android基础库
    compileOnly 'androidx.annotation:annotation:1.9.1'
}
